<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DLS Tournament</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  background: #f2f4f7;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 450px;
  margin: 0 auto;
  padding: 20px 14px;
}

.box {
  width: 100%;
  background: #fff;
  padding: 22px 18px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.10);
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 25px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin: 0 0 22px;
}

input {
  display: block;
  width: 100%;
  height: 48px;
  padding: 0 13px;
  margin-bottom: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

button {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 12px;
  margin-top: 8px;
  border: 0;
  border-radius: 8px;
  background: #1677ff;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.secondary {
  background: #555;
}

.logout {
  background: #e53935;
}

.hidden {
  display: none !important;
}

.message {
  width: 100%;
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.dashboard {
  width: 100%;
  text-align: center;
}

.balance {
  width: 100%;
  background: #eef6ff;
  padding: 18px;
  border-radius: 10px;
  margin: 18px 0;
}

.balance-number {
  display: block;
  margin-top: 6px;
  font-size: 30px;
  font-weight: bold;
}

@media (max-width: 360px) {
  .container {
    padding: 15px 10px;
  }

  .box {
    padding: 20px 14px;
  }

  h1 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- SIGN UP -->
  <div class="box" id="signupBox">

    <h1>DLS Tournament</h1>

    <p class="subtitle">Create Player Account</p>

    <input
      type="text"
      id="signupName"
      placeholder="Player Name">

    <input
      type="text"
      id="signupDlsId"
      placeholder="DLS ID">

    <input
      type="email"
      id="signupEmail"
      placeholder="Email">

    <input
      type="password"
      id="signupPassword"
      placeholder="Password">

    <button onclick="signUp()">
      Sign Up
    </button>

    <button
      class="secondary"
      onclick="showLogin()">
      Already have an account? Sign In
    </button>

    <div
      class="message"
      id="signupMessage">
    </div>

  </div>


  <!-- LOGIN -->
  <div
    class="box hidden"
    id="loginBox">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Sign in to your account
    </p>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email">

    <input
      type="password"
      id="loginPassword"
      placeholder="Password">

    <button
      id="loginButton"
      onclick="login()">
      Sign In
    </button>

    <button
      class="secondary"
      onclick="showSignup()">
      Create New Account
    </button>

    <div
      class="message"
      id="loginMessage">
    </div>

  </div>


  <!-- DASHBOARD -->
  <div
    class="box hidden"
    id="dashboardBox">

    <div class="dashboard">

      <h1>DLS Tournament</h1>

      <p class="subtitle">
        Player Dashboard
      </p>

      <strong>Player Name</strong>

      <p id="playerName">
        ---
      </p>

      <strong>DLS ID</strong>

      <p id="playerDlsId">
        ---
      </p>

      <div class="balance">

        <div>
          Wallet Balance
        </div>

        <span
          class="balance-number"
          id="playerBalance">
          ৳0
        </span>

      </div>

      <button onclick="refreshProfile()">
        Refresh Balance
      </button>

      <button
        class="logout"
        onclick="logout()">
        Logout
      </button>

      <div
        class="message"
        id="dashboardMessage">
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://kovjixgjjastpgepcjml.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GzCoNc0UBNopbV-9vdSHAQ__3L2XobS";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   SHOW SIGNUP
========================= */

function showSignup() {

  document
    .getElementById("signupBox")
    .classList.remove("hidden");

  document
    .getElementById("loginBox")
    .classList.add("hidden");
}


/* =========================
   SHOW LOGIN
========================= */

function showLogin() {

  document
    .getElementById("signupBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");
}


/* =========================
   SHOW DASHBOARD
========================= */

function showDashboard() {

  document
    .getElementById("signupBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("dashboardBox")
    .classList.remove("hidden");
}


/* =========================
   SIGN UP
========================= */

async function signUp() {

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const dlsId =
    document
      .getElementById("signupDlsId")
      .value
      .trim();

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const message =
    document.getElementById("signupMessage");


  if (!name || !dlsId || !email || !password) {

    message.innerText =
      "সব ঘর পূরণ করো।";

    return;
  }


  message.innerText =
    "Account তৈরি হচ্ছে...";


  try {

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password

      });


    if (error) {

      message.innerText =
        error.message;

      return;
    }


    if (!data.user) {

      message.innerText =
        "Account তৈরি করা যায়নি।";

      return;
    }


    const { error: playerError } =
      await supabaseClient
        .from("players")
        .insert({

          "Id": data.user.id,

          "DIs id": dlsId,

          "Balance": 0,

          "Name": name,

          "Email": email

        });


    if (playerError) {

      message.innerText =
        "Account হয়েছে, কিন্তু Player Data save হয়নি: "
        + playerError.message;

      return;
    }


    message.innerText =
      "Account সফলভাবে তৈরি হয়েছে। এখন Sign In করো।";


    setTimeout(function() {

      showLogin();

    }, 1200);


  } catch (error) {

    message.innerText =
      "Error: " + error.message;

  }
}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");

  const button =
    document.getElementById("loginButton");


  if (!email || !password) {

    message.innerText =
      "Email এবং Password দাও।";

    return;
  }


  button.disabled = true;

  button.innerText =
    "Signing In...";

  message.innerText =
    "";


  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      message.innerText =
        error.message;

      button.disabled = false;

      button.innerText =
        "Sign In";

      return;
    }


    if (!data.user) {

      message.innerText =
        "User পাওয়া যায়নি।";

      button.disabled = false;

      button.innerText =
        "Sign In";

      return;
    }


    message.innerText =
      "Login successful!";


    /*
      Login হওয়ার পর player data load
    */

    await loadProfile(data.user.id);


  } catch (error) {

    message.innerText =
      "Login error: " + error.message;

  }


  button.disabled = false;

  button.innerText =
    "Sign In";
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(userId = null) {

  const dashboardMessage =
    document.getElementById("dashboardMessage");


  try {

    /*
      যদি userId না থাকে,
      Supabase থেকে current user নেওয়া হবে
    */

    if (!userId) {

      const {
        data: userData,
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError) {

        showLogin();

        return;
      }


      if (!userData.user) {

        showLogin();

        return;
      }


      userId =
        userData.user.id;
    }


    /*
      Player table থেকে data নেওয়া
    */

    const { data, error } =
      await supabaseClient
        .from("players")
        .select(
          '"Name", "DIs id", "Balance", "Email"'
        )
        .eq(
          "Id",
          userId
        )
        .maybeSingle();


    if (error) {

      dashboardMessage.innerText =
        "Player data পাওয়া যায়নি: "
        + error.message;

      return;
    }


    if (!data) {

      dashboardMessage.innerText =
        "এই account-এর Player Data পাওয়া যায়নি।";

      return;
    }


    /*
      Dashboard data বসানো
    */

    document
      .getElementById("playerName")
      .innerText =
      data["Name"] || "---";


    document
      .getElementById("playerDlsId")
      .innerText =
      data["DIs id"] || "---";


    document
      .getElementById("playerBalance")
      .innerText =
      "৳" + (data["Balance"] ?? 0);


    dashboardMessage.innerText =
      "";


    /*
      Dashboard দেখানো
    */

    showDashboard();


  } catch (error) {

    dashboardMessage.innerText =
      "Profile error: " + error.message;

  }
}


/* =========================
   REFRESH
========================= */

async function refreshProfile() {

  const message =
    document.getElementById("dashboardMessage");

  message.innerText =
    "Loading...";


  await loadProfile();


  setTimeout(function() {

    message.innerText = "";

  }, 500);
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("dashboardBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("loginEmail")
    .value = "";

  document
    .getElementById("loginPassword")
    .value = "";

  document
    .getElementById("loginMessage")
    .innerText = "";
}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

  try {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();


    if (session && session.user) {

      await loadProfile(
        session.user.id
      );

    }

  } catch (error) {

    console.log(
      "Session error:",
      error
    );

  }
}


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
