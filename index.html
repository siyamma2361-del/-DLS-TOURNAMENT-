<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>DLS Tournament</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

body {
  background: #f2f4f7;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 450px;
  padding: 20px 14px;
  margin: 0 auto;
}

.box {
  width: 100%;
  background: #ffffff;
  padding: 22px 18px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 0 0 8px;
}

.subtitle {
  text-align: center;
  color: #666;
  font-size: 14px;
  margin: 0 0 22px;
}

input {
  display: block;
  width: 100%;
  max-width: 100%;
  height: 48px;
  padding: 0 13px;
  margin: 0 0 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #1677ff;
}

button {
  display: block;
  width: 100%;
  max-width: 100%;
  min-height: 48px;
  padding: 12px;
  margin-top: 8px;
  border: 0;
  border-radius: 8px;
  background: #1677ff;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.secondary {
  background: #555;
}

.logout {
  background: #e53935;
}

.hidden {
  display: none !important;
}

.message {
  width: 100%;
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.dashboard {
  width: 100%;
  text-align: center;
}

.info {
  width: 100%;
  overflow-wrap: anywhere;
}

.balance {
  width: 100%;
  background: #eef6ff;
  padding: 18px;
  border-radius: 10px;
  margin: 18px 0;
}

.balance-title {
  font-size: 15px;
}

.balance-number {
  display: block;
  margin-top: 6px;
  font-size: 30px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

@media (max-width: 360px) {
  .container {
    padding: 15px 10px;
  }

  .box {
    padding: 20px 14px;
  }

  h1 {
    font-size: 22px;
  }

  input,
  button {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- SIGN UP -->
  <div class="box" id="signupBox">

    <h1>DLS Tournament</h1>

    <p class="subtitle">
      Create Player Account
    </p>

    <input
      type="text"
      id="signupName"
      placeholder="Player Name"
    >

    <input
      type="text"
      id="signupDlsId"
      placeholder="DLS ID"
    >

    <input
      type="email"
      id="signupEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="signupPassword"
      placeholder="Password"
    >

    <button onclick="signUp()">
      Sign Up
    </button>

    <button
      class="secondary"
      onclick="showLogin()">
      Already have an account? Sign In
    </button>

    <div
      class="message"
      id="signupMessage">
    </div>

  </div>


  <!-- LOGIN -->
  <div
    class="box hidden"
    id="loginBox">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Sign in to your account
    </p>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button onclick="login()">
      Sign In
    </button>

    <button
      class="secondary"
      onclick="showSignup()">
      Create New Account
    </button>

    <div
      class="message"
      id="loginMessage">
    </div>

  </div>


  <!-- DASHBOARD -->
  <div
    class="box hidden"
    id="dashboardBox">

    <div class="dashboard">

      <h1>DLS Tournament</h1>

      <p class="subtitle">
        Player Dashboard
      </p>

      <div class="info">
        <strong>Player Name</strong>
        <p id="playerName">---</p>
      </div>

      <div class="info">
        <strong>DLS ID</strong>
        <p id="playerDlsId">---</p>
      </div>

      <div class="balance">

        <div class="balance-title">
          Wallet Balance
        </div>

        <span
          class="balance-number"
          id="playerBalance">
          ৳0
        </span>

      </div>

      <button onclick="refreshProfile()">
        Refresh Balance
      </button>

      <button
        class="logout"
        onclick="logout()">
        Logout
      </button>

      <div
        class="message"
        id="dashboardMessage">
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE SETTINGS
========================= */

const SUPABASE_URL =
"https://kovjixgjjastpgepcjml.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GzCoNc0UBNopbV-9vdSHAQ__3L2XobS";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   SHOW SIGN UP
========================= */

function showSignup() {

  document
    .getElementById("signupBox")
    .classList.remove("hidden");

  document
    .getElementById("loginBox")
    .classList.add("hidden");
}


/* =========================
   SHOW LOGIN
========================= */

function showLogin() {

  document
    .getElementById("signupBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");
}


/* =========================
   SIGN UP
========================= */

async function signUp() {

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const dlsId =
    document
      .getElementById("signupDlsId")
      .value
      .trim();

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const message =
    document.getElementById("signupMessage");


  if (!name || !dlsId || !email || !password) {

    message.innerText =
      "সব ঘর পূরণ করো।";

    return;
  }


  message.innerText =
    "Account তৈরি হচ্ছে...";


  try {

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password

      });


    if (error) {

      message.innerText =
        error.message;

      return;
    }


    if (!data.user) {

      message.innerText =
        "Account তৈরি করা যায়নি।";

      return;
    }


    const { error: playerError } =
      await supabaseClient
        .from("players")
        .insert({

          id: data.user.id,

          name: name,

          dls_id: dlsId,

          email: email,

          balance: 0

        });


    if (playerError) {

      message.innerText =
        "Player data save হয়নি: "
        + playerError.message;

      return;
    }


    message.innerText =
      "Account তৈরি হয়েছে। এখন Sign In করো।";


    setTimeout(function() {

      showLogin();

    }, 1500);


  } catch (error) {

    message.innerText =
      "Error: " + error.message;

  }
}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");


  if (!email || !password) {

    message.innerText =
      "Email এবং Password দাও।";

    return;
  }


  message.innerText =
    "Sign In হচ্ছে...";


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    message.innerText =
      error.message;

    return;
  }


  await loadProfile();
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    showLogin();

    return;
  }


  const { data, error } =
    await supabaseClient
      .from("players")
      .select(
        "name,dls_id,balance,email"
      )
      .eq("id", user.id)
      .single();


  if (error) {

    document
      .getElementById("dashboardMessage")
      .innerText =
      "Player data পাওয়া যায়নি: "
      + error.message;

    return;
  }


  document
    .getElementById("playerName")
    .innerText =
    data.name || "---";


  document
    .getElementById("playerDlsId")
    .innerText =
    data.dls_id || "---";


  document
    .getElementById("playerBalance")
    .innerText =
    "৳" + (data.balance || 0);


  document
    .getElementById("signupBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("dashboardBox")
    .classList.remove("hidden");
}


/* =========================
   REFRESH
========================= */

async function refreshProfile() {

  document
    .getElementById("dashboardMessage")
    .innerText =
    "Loading...";


  await loadProfile();


  document
    .getElementById("dashboardMessage")
    .innerText =
    "";
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();


  document
    .getElementById("dashboardBox")
    .classList.add("hidden");


  document
    .getElementById("loginBox")
    .classList.remove("hidden");
}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (session) {

    await loadProfile();

  }
}


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
