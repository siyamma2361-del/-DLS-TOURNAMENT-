<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLS Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #ccc;
    }

    h2 {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 7px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #16803c;
      color: white;
      font-size: 16px;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>DLS Tournament</h2>

  <input type="text" id="name" placeholder="Name">
  <input type="email" id="email" placeholder="Email">
  <input type="text" id="dls_id" placeholder="DLS ID">

  <button onclick="registerPlayer()">Register</button>

  <div id="message"></div>
</div>

<script>
  const SUPABASE_URL = "https://kovjixgjjastpgepcjml.supabase.co";
  const SUPABASE_KEY = "sb_publishable_GzCoNcOUI";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function registerPlayer() {

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const dls_id = document.getElementById("dls_id").value.trim();

    if (!name || !email || !dls_id) {
      document.getElementById("message").innerText =
        "সব তথ্য পূরণ করো";
      return;
    }

    const { data, error } = await supabaseClient
      .from("players")
      .insert([
        {
          name: name,
          email: email,
          dls_id: dls_id
        }
      ])
      .select();

    if (error) {
      document.getElementById("message").innerText =
        "Error: " + error.message;
      return;
    }

    document.getElementById("message").innerText =
      "Registration successful!";

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("dls_id").value = "";
  }
</script>

</body>
</html>
